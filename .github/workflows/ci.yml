name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo check --examples
      - run: cargo check --all-targets --features onnx
      - run: cargo check --all-targets --features cuda
      # The features that carry most of the intra-doc links. `metal` is left
      # out because it only builds on macOS.
      - run: cargo doc --no-deps --features cuda,onnx,images
        env:
          RUSTDOCFLAGS: -D warnings
      # CI has no GPU, so every CUDA test skips. On a GPU machine, run
      # `RUSTING_BRAIN_REQUIRE_CUDA=1 cargo test --features cuda` to make a
      # skip fail instead.

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # `rust-version` in Cargo.toml is a promise to anyone on an older
      # toolchain. Stable alone never checks it, and a transitive dependency
      # can raise its own MSRV in a patch release, so this job is the only
      # thing that catches the break before a user does.
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --locked --all-targets
      - run: cargo check --locked --all-targets --features onnx
      - run: cargo check --locked --all-targets --features cuda

  semver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Compares the public API against the last release tag, so the next
      # breaking change is a choice. Default features only: the tool resolves
      # dependencies afresh, without Cargo.lock, and `metal` only builds on
      # macOS.
      - id: release
        run: echo "tag=$(git describe --tags --abbrev=0 --match "v*")" >> "$GITHUB_OUTPUT"
      - uses: obi1kenobi/cargo-semver-checks-action@v2
        with:
          baseline-rev: ${{ steps.release.outputs.tag }}
          feature-group: default-features
