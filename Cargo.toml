[package]
name = "rusting_brain"
version = "3.0.0"
edition = "2024"
description = "A Rust deep-learning library for training and running transformer language models, dense and mixture-of-experts, on CPU or CUDA."
readme = "README.md"
license-file = "LICENSE.md"
rust-version = "1.85"
documentation = "https://docs.rs/rusting_brain"
homepage = "https://github.com/Vasyl-Trefilov/RustingBrain"
repository = "https://github.com/Vasyl-Trefilov/RustingBrain.git"
keywords = ["llm", "transformer", "machine-learning", "cuda", "mixture-of-experts"]
categories = ["science", "algorithms"]

[dependencies]
matrixmultiply = { version = "0.3.11", features = ["threading", "avx512"] }
rayon = "1.11.0"
rand = { version = "0.8", features =["std", "std_rng"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
cudarc = { version = "0.19.3", optional = true, default-features = false, features = ["std", "cublas", "nvrtc", "runtime", "dynamic-loading", "cuda-13010", "f16"] }
tract-onnx = { version = "0.21", optional = true }
# Decoders only: the default feature set pulls in every format plus their
# encoders, and a dataset loader reads PNG and JPEG.
image = { version = "0.25", optional = true, default-features = false, features = ["png", "jpeg"] }
half = { version = "2", optional = true }

# Metal only exists on Apple platforms, so the dependency is target-scoped:
# `--features metal` stays a valid (if inert) request on Linux and Windows,
# where `metal_training` is simply not compiled and the backend reports
# `MetalFeatureDisabled` instead of failing to build.
[target.'cfg(target_os = "macos")'.dependencies]
metal = { version = "0.33", optional = true }

[features]
default = []
cuda = ["dep:cudarc", "dep:half"]
# Compatibility aliases. Cargo features are additive, so selecting a concrete
# ABI in each alias makes `--all-features` invalid. The crate now has one
# supported backend ABI and keeps the historic names as source-compatible aliases.
cuda-11-8 = ["cuda"]
cuda-12-0 = ["cuda"]
cuda-12-4 = ["cuda"]
cuda-12-6 = ["cuda"]
cuda-12-8 = ["cuda"]
cuda-13-0 = ["cuda"]
cuda-13-1 = ["cuda"]
metal = ["dep:metal"]
onnx = ["dep:tract-onnx"]
images = ["dep:image"]

[[example]]
name = "image_classification"
required-features = ["images"]

[[example]]
name = "text_to_image"
required-features = ["images"]

[[example]]
name = "vit_tokens"
required-features = ["images"]

[[example]]
name = "image_to_3d"
required-features = ["images"]

[[example]]
name = "cuda_training_smoke"
required-features = ["cuda"]

[[example]]
name = "profile_shape"
required-features = ["cuda"]

[[example]]
name = "cuda_persistent_training"
required-features = ["cuda"]

[[example]]
name = "gemm_probe"
required-features = ["cuda"]

[[example]]
name = "flash_probe"
required-features = ["cuda"]

[[example]]
name = "cuda_image_bench"
required-features = ["cuda"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
